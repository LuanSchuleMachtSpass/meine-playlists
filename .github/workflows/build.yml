name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk MeinePlaylists.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeinePlaylists-apk
          path: MeinePlaylists.apk
      # Veröffentlicht die APK als Release -> direkter Download-Link auf der Repo-Seite
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MeinePlaylists.apk \
            --title "Meine Playlists $TAG" \
            --notes "APK herunterladen, aufs Handy kopieren und installieren." \
            --latest
      # Alte Versionen entfernen – es bleibt nur das neueste Release
      - name: Alte Releases löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r OLD; do
            if [ "$OLD" != "$TAG" ]; then
              gh release delete "$OLD" --cleanup-tag --yes
            fi
          done
